<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Divyanshu Pandey — Software Development Engineer</title>
    <meta
      name="description"
      content="Divyanshu Pandey — Software Development Engineer building cloud data infrastructure: AWS pipelines, PostgreSQL, Docker/Kubernetes, and CI/CD across IoT, media, and fintech production systems."
    />
    <meta name="theme-color" content="#FAF9F6" />
    <!-- The JS bundle filename changes hash on every deploy, so this HTML
         document itself must never be served stale from cache — otherwise
         a cached page can reference a bundle file that no longer exists
         in the latest deployment and the app fails to load silently. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <meta property="og:title" content="Divyanshu Pandey — Software Development Engineer" />
    <meta
      property="og:description"
      content="Software Development Engineer building cloud data infrastructure: AWS pipelines, PostgreSQL, Docker/Kubernetes, and CI/CD across IoT, media, and fintech production systems."
    />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      * {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Self-heal against a stale cached copy of this page pointing at a JS
      // bundle filename that no longer exists after a newer deploy (the
      // bundle's hashed name changes every build, so a 404 on it just
      // leaves #root empty with no visible error). If nothing has mounted
      // after a few seconds, force one reload to fetch the current HTML.
      (function () {
        var RELOAD_GUARD = 'portfolio-reload-once';
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length === 0 && !sessionStorage.getItem(RELOAD_GUARD)) {
            sessionStorage.setItem(RELOAD_GUARD, '1');
            location.reload();
          }
        }, 3000);
      })();
    </script>
  </body>
</html>
